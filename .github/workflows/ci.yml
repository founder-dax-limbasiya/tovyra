name: OTHRI mobile checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Export Android bundle
        run: npx expo export --platform android

      - name: Configure Expo Router type generation
        run: npx expo customize tsconfig.json

      - name: Type-check
        run: npm run typecheck
